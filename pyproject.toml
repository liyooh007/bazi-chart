[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazi-chart"
dynamic = ["version"]
description = "四柱八字 CLI 排盘引擎：真太阳时跨日修正、VSOP87D/JPL DE441 精度节气、农历转换、格局用神、神煞大运（纯标准库离线）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "liyooh007" }]
keywords = ["bazi", "four-pillars", "chinese-calendar", "true-solar-time", "astronomy", "lunar-calendar", "jpl-ephemeris", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Religion",
    "Topic :: Utilities",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bazi = "bazi.cli:main"
bazi-mcp = "bazi.mcp_server:main"

[project.urls]
Homepage = "https://github.com/liyooh007/bazi-chart"
Repository = "https://github.com/liyooh007/bazi-chart"
Documentation = "https://github.com/liyooh007/bazi-chart#readme"
"Online Demo" = "https://liyooh007.github.io/bazi-chart/demo.html"
Issues = "https://github.com/liyooh007/bazi-chart/issues"
Changelog = "https://github.com/liyooh007/bazi-chart/releases"

[tool.setuptools.packages.find]
include = ["bazi*"]
exclude = ["bazi.tests*", "tests*"]

[tool.setuptools.dynamic]
version = { attr = "bazi.__version__" }

[tool.pytest.ini_options]
testpaths = ["bazi/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
